<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Racha de la crema</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--text:#1f2a1f;--muted:#6b7a6b;--green:#58cc02;--green-d:#46a302;--orange:#ff9600;--line:#e2e6dc;--red:#ff4b4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--card:#1f2e35;--text:#f1f7fb;--muted:#9bb0ba;--line:#33474f}}
:root[data-theme="dark"]{--bg:#131f24;--card:#1f2e35;--text:#f1f7fb;--muted:#9bb0ba;--line:#33474f}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
main{max-width:460px;margin:0 auto;padding:20px 16px 40px}
.top{text-align:center}
.flame{font-size:64px;line-height:1}
.num{font-size:48px;font-weight:800;color:var(--orange);line-height:1.1}
.sub{color:var(--muted);font-weight:600}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin:18px 0 6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.cap{font-size:13px;color:var(--muted);text-align:center;margin-bottom:18px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:18px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{border:2px solid var(--line);border-bottom-width:5px;background:var(--card);color:var(--text);border-radius:16px;padding:16px 6px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.b span{display:block;font-size:30px;margin-bottom:4px}
.b.on{background:var(--green);border-color:var(--green-d);color:#fff}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.d{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;padding:0}
.d.full{background:var(--green);border-color:var(--green-d);color:#fff}
.d.half{background:var(--orange);border-color:var(--orange);color:#fff}
.d.miss{border-color:var(--red);color:var(--red)}
.d.sel{outline:3px solid var(--text);outline-offset:2px}
.msg{text-align:center;font-weight:700;margin:0 0 16px;min-height:22px}
.reset{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;font-family:inherit}
.leg{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="top"><div class="flame" id="fl">🔥</div><div class="num" id="streak">0</div><div class="sub">días de racha</div></div>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="cap" id="cap"></div>
  <p class="msg" id="msg"></p>
  <div class="card">
    <h2 id="dayTitle"></h2>
    <div class="btns">
      <button class="b" id="bm"><span>☀️</span>Mañana</button>
      <button class="b" id="bn"><span>🌙</span>Noche</button>
    </div>
  </div>
  <div class="card">
    <h2>Tus 21 días</h2>
    <div class="grid" id="grid"></div>
    <div class="leg">Verde: las dos cremas · Naranja: solo una · Rojo: ninguna</div>
  </div>
  <button class="reset" id="reset">Empezar de nuevo</button>
</main>
<script>
var N=21,KEY="racha-crema-v1",S=null,sel=0,armed=false;
function key(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function parse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return key(d)}
function idxToday(){return Math.round((parse(key(new Date()))-parse(S.start))/864e5)}
function load(){try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
  if(!S||!S.start)S={start:key(new Date()),log:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function get(i){return S.log[addDays(S.start,i)]||{}}
function full(i){var l=get(i);return !!(l.m&&l.n)}
function render(){
  var t=idxToday();if(t<0)t=0;var tc=Math.min(t,N-1);
  var done=0;for(var i=0;i<N;i++)if(full(i))done++;
  var st=0,i2=tc;if(!full(i2)&&t<=N-1)i2--;
  while(i2>=0&&full(i2)){st++;i2--}
  document.getElementById("streak").textContent=st;
  document.getElementById("fl").style.filter=st>0?"none":"grayscale(1)";
  document.getElementById("bar").style.width=(done/N*100)+"%";
  document.getElementById("cap").textContent=done+" de "+N+" días completos";
  var msg="";
  if(done>=N)msg="🎉 ¡Terminaste las 3 semanas! Misión cumplida.";
  else if(t>N-1)msg="Pasaron los 21 días. Completá los que te faltan marcándolos abajo.";
  else if(full(tc))msg="¡Hoy listo! Mañana seguimos 💪";
  else if(get(tc).m||get(tc).n)msg="Te falta una crema hoy";
  else if(st>0)msg="¡No cortes la racha!";
  else msg="Empezá hoy tu racha 🔥";
  document.getElementById("msg").textContent=msg;
  var l=get(sel);
  var lab=sel===tc&&t<=N-1?" · hoy":(sel<tc?" · pasado":"");
  document.getElementById("dayTitle").textContent="Día "+(sel+1)+" de "+N+lab;
  document.getElementById("bm").className="b"+(l.m?" on":"");
  document.getElementById("bn").className="b"+(l.n?" on":"");
  var g=document.getElementById("grid");g.innerHTML="";
  for(var j=0;j<N;j++){(function(j){
    var b=document.createElement("button"),c=get(j),cls="d";
    if(c.m&&c.n)cls+=" full";else if(c.m||c.n)cls+=" half";else if(j<tc||(j===tc&&t>N-1))cls+=" miss";
    if(j===sel)cls+=" sel";
    b.className=cls;b.textContent=j+1;
    b.onclick=function(){sel=j;render()};g.appendChild(b)})(j)}
}
function toggle(f){var k=addDays(S.start,sel);var l=S.log[k]||{};l[f]=!l[f];S.log[k]=l;save();render()}
document.getElementById("bm").onclick=function(){toggle("m")};
document.getElementById("bn").onclick=function(){toggle("n")};
var rb=document.getElementById("reset");
rb.onclick=function(){
  if(!armed){armed=true;rb.textContent="¿Seguro? Tocá de nuevo para borrar todo";setTimeout(function(){armed=false;rb.textContent="Empezar de nuevo"},4000);return}
  S={start:key(new Date()),log:{}};save();sel=0;armed=false;rb.textContent="Empezar de nuevo";render()};
load();var t0=idxToday();sel=Math.max(0,Math.min(t0,N-1));render();
</script>
</body>
</html>
